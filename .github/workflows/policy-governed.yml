name: policy-governed measurement

# The measurement instrument for the POLICY-GOVERNED line.
#
# WHAT THIS IS NOT, stated first because the whole line turns on it:
#
#   This workflow is NOT a gate, and it is NOT evidence of judge independence.
#   It lives in the head of the branch it measures, which means a candidate can
#   edit it. PREREG.md §10 says so in advance, and the WORKFLOW_MISMATCH
#   fixture exists precisely because a workflow in a personal repository cannot
#   be its own authority. Real enforcement needs an organization-level required
#   workflow or an external trusted judge, and both are a separate envelope.
#
# What it IS: the only place this line can run Nix at all. The machine the code
# is authored on has no Nix and cannot reach github.com over HTTP, and the
# pinned fixture is a github: flake. So every Nix-dependent observable in
# PREREG.md §3-§5 is measured here, on both versions, and recorded.
#
# The closed line's evidence-run.yml is untouched and still triggers on its own
# branches.

on:
  push:
    branches: [ 'claude/policy-governed-*' ]
  workflow_dispatch:

jobs:
  # No Nix needed. Runs first and on every push, because everything the
  # authority boundary rests on was deliberately built not to need a store.
  shell-units:
    runs-on: ubuntu-latest
    name: shell units (no Nix)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The CLOSED line's units must stay green
        run: ./tests/unit-shell.sh
      - name: The policy-governed line's units
        run: ./tests/pg-unit.sh

      - name: The adversarial corpus, gated, with its controls
        run: |
          set -o pipefail
          fail=0
          for fx in policy-self-exemption judge-replacement workflow-replacement \
                    origin-moved policy-dependency-cochange; do
            D=experiments/policy-governed/fixtures/$fx
            echo "=============================== $fx"
            # THE CONTROL FIRST. A corpus whose baseline is already red proves
            # nothing about any mutation.
            ./bin/nse-pg gate --trusted-root "$D/base" --candidate-root "$D/base" \
              --trusted-rev base --candidate-rev base \
              --out "/tmp/gate-$fx-control.json" >/dev/null 2>&1 || true
            ctl=$(jq -r .verdict "/tmp/gate-$fx-control.json")
            echo "  CONTROL base-vs-base: $ctl"
            [ "$ctl" = ACCEPTED ] || { echo "  !! the control is not ACCEPTED; this specimen proves nothing"; fail=1; }
            ./bin/nse-pg gate --trusted-root "$D/base" --candidate-root "$D/head" \
              --trusted-rev base --candidate-rev head \
              --out "/tmp/gate-$fx.json" >/dev/null 2>&1 || true
            echo "  HEAD verdict: $(jq -r .verdict "/tmp/gate-$fx.json")  rejectedBy: $(jq -c .rejectedBy "/tmp/gate-$fx.json")"
            [ "$(jq -r .verdict "/tmp/gate-$fx.json")" = REJECTED ] \
              || { echo "  !! the head state was NOT rejected"; fail=1; }
          done
          exit $fail

      - name: The check summary, rendered
        run: |
          echo "############ a REJECTED proposal ############"
          ./bin/nse-pg summary --gate-report /tmp/gate-policy-self-exemption.json
          echo
          echo "############ an ACCEPTED one (the control) ############"
          ./bin/nse-pg summary --gate-report /tmp/gate-judge-replacement-control.json

  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Both versions, for the same reason the closed line measured both: the
        # `nix derivation show` document has two shapes, and a fact reader
        # validated against one of them is a fact reader with a 50% chance.
        nix: [ '2.34.7', '2.24.9' ]
    name: qualify facts (nix ${{ matrix.nix }})

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix ${{ matrix.nix }}
        uses: cachix/install-nix-action@v30
        with:
          install_url: https://releases.nixos.org/nix/nix-${{ matrix.nix }}/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      - name: Record what is being measured
        run: |
          nix --version
          echo "HEAD:            $(git rev-parse HEAD)"
          echo "frozen base:     84354e85872c385e649af0e1b90ef4a2e0997949"
          echo "nixpkgs pin:     $(jq -r '.nodes.nixpkgs.locked.rev' \
                                    experiments/policy-governed/fixtures/qualification/flake.lock)"
          echo "fixture pin:     $(jq -r '.nodes.nixpkgs.locked.rev' fixture/flake.lock)"
          # PREREG.md §3.2: ONE pin. Two pins in one line is a compatibility
          # surface nobody registered, and this line has that listed as a STOP
          # condition rather than as a thing to absorb.
          a=$(jq -r '.nodes.nixpkgs.locked.rev' \
                experiments/policy-governed/fixtures/qualification/flake.lock)
          b=$(jq -r '.nodes.nixpkgs.locked.rev' fixture/flake.lock)
          if [ "$a" != "$b" ]; then
            echo "PIN_MISMATCH: qualification fixture $a != closed fixture $b" >&2
            exit 1
          fi
          echo "PIN_AGREEMENT=YES"
          git status --porcelain
          echo "(empty above means a clean tree)"

      - name: §4 / §5 -- qualify facts and classify a bare escrow=true
        id: qualify
        run: |
          set -o pipefail
          ./bin/nse-pg qualify-facts \
            --out "experiments/policy-governed/results/facts-qualification-nix${{ matrix.nix }}.json" \
            2>&1 | tee /tmp/qualify.log
          echo "--- the report ---"
          jq . "experiments/policy-governed/results/facts-qualification-nix${{ matrix.nix }}.json"

      - name: READOUT
        if: always()
        run: |
          R=experiments/policy-governed/results/facts-qualification-nix${{ matrix.nix }}.json
          [ -f "$R" ] || { echo "no report produced"; exit 0; }
          echo "== §4 selector support on this Nix =="
          jq -r '.selectorSupport | to_entries[] | "  \(.key)=\(.value)"' "$R"
          echo "== §4 what the document actually carries =="
          jq -r '.probes[] | "  \(.target) [\(.drvSchema // "did-not-evaluate")]: \((.attrKeys // []) | join(","))"' "$R"
          echo "== §5 bare escrow=true =="
          jq -r '"  outcome:            \(.directAttr.outcome)",
                 "  detector qualified: \(.directAttr.detectorQualified)",
                 "  sentinel found at:  \(.directAttr.sentinel.attrSite // "NOWHERE")",
                 "  escrow found at:    \(.directAttr.foundAtSite // "NOWHERE")"' "$R"
          # The TAIL of a Nix eval failure is where the diagnosis is. The head
          # is the ladder it climbed to get there, and run 1 recorded only that.
          jq -r 'if .directAttr.evalErrorTail == null then "  (no eval error)"
                 else "  --- why it was rejected (tail of the eval error) ---",
                      (.directAttr.evalErrorTail | split("\n") | .[-14:][] | "  " + .)
                 end' "$R"
          echo "== §3.3 Nix-VALUE visibility (a different surface from §4) =="
          # PRESENT AND VALUE. `tag` came back present=true at the Nix-value
          # level and UNKNOWN in the derivation document -- which is a real and
          # interesting difference between the two surfaces, and presence alone
          # cannot tell "present and null" from "present and set".
          jq -r '(.nixValueVisibility // {}) | to_entries[] as $v
                 | ($v.value | to_entries[])
                 | "  \($v.key).\(.key): present=\(.value.present) value=\((.value.value // "null") | tostring | .[0:60])"' "$R"

      - name: §3.4-§3.6 -- what the annotation moves, and what it must not
        id: annotate
        run: |
          set -o pipefail
          ./bin/nse-pg qualify-annotation \
            --out "experiments/policy-governed/results/annotation-qualification-nix${{ matrix.nix }}.json" \
            2>&1 | tee /tmp/annotate.log

      - name: ANNOTATION READOUT
        if: always()
        run: |
          A=experiments/policy-governed/results/annotation-qualification-nix${{ matrix.nix }}.json
          [ -f "$A" ] || { echo "no annotation report produced"; exit 0; }
          echo "== §3.4 the six registered observables =="
          jq -r '.levels[] | "  \(.level): drv=\(.drvIdentity)  output=\(.outputIdentity)"' "$A"
          echo "== visibility, with its red control =="
          jq -r '"  marked source carries it:  \(.annotationVisibility.markedSourceCarriesIt) at \(.annotationVisibility.attrSite // "NOWHERE")",
                 "  red control (unannotated): \(.annotationVisibility.redControlUnannotatedSource)",
                 "  guard qualified:           \(.annotationVisibility.qualified)"' "$A"
          echo "== rebuild work =="
          jq -r '"  marked outputs valid after building ONLY the plain chain: \(.rebuildWork.markedOutputsAlreadyValidAfterPlainBuildOnly)/\(.rebuildWork.markedOutputsChecked)",
                 "  verdict: \(.rebuildWork.verdict)"' "$A"
          echo "== OBJECTS_REALISED (gap-23 arithmetic) =="
          jq -r '"  count: \(.realisedSet.countIdentity)  (\(.realisedSet.plainCount) vs \(.realisedSet.markedCount))",
                 "  set:   \(.realisedSet.setIdentity)",
                 "  only in plain: \(.realisedSet.onlyInPlain) (of which .drv: \(.realisedSet.onlyInPlainDrv))",
                 "  only in marked: \(.realisedSet.onlyInMarked) (of which .drv: \(.realisedSet.onlyInMarkedDrv))",
                 "  symmetric difference is ALL .drv: \(.realisedSet.symmetricDifferenceIsAllDrv)",
                 "  realised-set sha256: \(.realisedSet.realisedSetShaIdentity)  <- PREREG §3.5 expected churn, NOT a regression"' "$A"
          echo "== C4 =="
          jq -r '.c4 | "  all three drvs moved:   \(.allThreeDrvsMoved)",
                       "  all three outputs held: \(.allThreeOutputsHeld)",
                       "  no rebuild work:        \(.noRebuildWork)",
                       "  annotation visible:     \(.annotationVisible)",
                       "  VERDICT: \(.verdict)"' "$A"

      - name: §6/§11.1 -- a RECORDED facts document from a real graph
        id: facts
        run: |
          set -o pipefail
          ./bin/nse-pg facts \
            --installable "path:$PWD/experiments/policy-governed/fixtures/qualification#ann-plain-top" \
            --out "experiments/policy-governed/results/facts-nix${{ matrix.nix }}.json" \
            2>&1 | tee /tmp/facts.log
          echo "--- what the matcher can select on, over a REAL graph ---"
          jq -r '[.dependencies[] | {c:.class, o:.owner.source, h:.originHost.source, s:.discoveryStatus}]
                 | group_by([.c,.o,.h,.s])
                 | .[] | "  \(.[0].c) owner=\(.[0].o) originHost=\(.[0].h) status=\(.[0].s): \(length)"' \
            "experiments/policy-governed/results/facts-nix${{ matrix.nix }}.json"

      - name: §13 -- decide the real graph under the repository policy
        run: |
          set -o pipefail
          F=experiments/policy-governed/results/facts-nix${{ matrix.nix }}.json
          ./bin/nse-pg decide --facts "$F" \
            --policy nix-source-escrow.toml \
            --policy-rev "$(git rev-parse HEAD)" \
            --out "experiments/policy-governed/results/decisions-nix${{ matrix.nix }}.json"
          jq -r '.counts | to_entries[] | "  \(.key)=\(.value)"' \
            "experiments/policy-governed/results/decisions-nix${{ matrix.nix }}.json"
          echo "--- rules that matched, and rules that could not ---"
          jq -r '[.decisions[] | .matchedRuleIds[]] | group_by(.) | .[] | "  \(.[0]): \(length)"' \
            "experiments/policy-governed/results/decisions-nix${{ matrix.nix }}.json"
          jq -r '[.decisions[] | .unmatchedForUnknownFact[] | "\(.ruleId)/\(.selectors|join("+"))"]
                 | group_by(.) | .[] | "  inert (unknown fact) \(.[0]): \(length)"' \
            "experiments/policy-governed/results/decisions-nix${{ matrix.nix }}.json"
          # An UNDECIDED dependency means the policy could not be resolved for
          # it. That is a fail-closed state and this measurement must not pass
          # over it quietly.
          u=$(jq -r '.counts.undecided' "experiments/policy-governed/results/decisions-nix${{ matrix.nix }}.json")
          echo "UNDECIDED=$u"

      - name: §11.1 -- the SAME corpus, on a RECORDED seed
        # This is the step that turns the corpus from a mechanism test into
        # evidence. Identical generator, identical mutations, and a seed that a
        # real Nix produced from a real graph rather than one somebody typed.
        # The controls have to hold at that scale or nothing else here counts.
        run: |
          set -o pipefail
          F=experiments/policy-governed/results/facts-nix${{ matrix.nix }}.json
          ./bin/nse-pg corpus --seed "$F" --corpus-dir /tmp/corpus-recorded
          jq -r '"seed: \(.seedProvenance)  dependencies: \(.seedDependencies)",
                 "meaning: \(.meaning)"' /tmp/corpus-recorded/SEED.json
          echo "rules derived from the seed:"
          grep -c '^\[\[rule\]\]' /tmp/corpus-recorded/origin-moved/base/nix-source-escrow.toml
          fail=0
          for fx in policy-self-exemption judge-replacement workflow-replacement \
                    origin-moved policy-dependency-cochange; do
            D=/tmp/corpus-recorded/$fx
            ./bin/nse-pg gate --trusted-root "$D/base" --candidate-root "$D/base" \
              --trusted-rev base --candidate-rev base \
              --out "/tmp/rec-$fx-control.json" >/dev/null 2>&1 || true
            ./bin/nse-pg gate --trusted-root "$D/base" --candidate-root "$D/head" \
              --trusted-rev base --candidate-rev head \
              --out "/tmp/rec-$fx.json" >/dev/null 2>&1 || true
            ctl=$(jq -r .verdict "/tmp/rec-$fx-control.json")
            hd=$(jq -r .verdict "/tmp/rec-$fx.json")
            echo "  $fx: control=$ctl head=$hd rejectedBy=$(jq -c .rejectedBy "/tmp/rec-$fx.json")"
            [ "$ctl" = ACCEPTED ]  || { echo "  !! control not ACCEPTED on the recorded seed"; fail=1; }
            [ "$hd"  = REJECTED ]  || { echo "  !! head not REJECTED on the recorded seed"; fail=1; }
          done
          cp /tmp/corpus-recorded/SEED.json \
             "experiments/policy-governed/results/corpus-seed-nix${{ matrix.nix }}.json"
          exit $fail

      - name: §14 -- the untrusted phase, local and ephemeral, SOURCE_ORIGIN_INDEPENDENCE
        # The CHEAPER guarantee, named explicitly. PREREG.md §16 allows a
        # cheaper guarantee for governance work WHEN IT IS STATED, and the
        # ESCROW_REPLAY control below is what keeps the strong path honest.
        run: |
          set -o pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          NSE_PG_STAGING="$RUNNER_TEMP/pg-shared-staging" ./bin/nse-pg scratch \
            --installable "path:$PWD/fixture#default" \
            --guarantee source-origin-independence \
            --scratch-dir "$RUNNER_TEMP/pg-scratch-soi" \
            --out "experiments/policy-governed/results/scratch-soi-nix${{ matrix.nix }}.json" \
            2>&1 | tail -40
          jq -r '"CHECK: \(.checkName)",
                 "  exit=\(.exitCode) elapsed=\(.elapsedMilliseconds)ms",
                 "  preflight=\(.preflight.verdict) scrubbed=\(.preflight.credentialsScrubbed | join(",") | if . == "" then "nothing" else . end)",
                 "  durablePromotion=\(.scratch.durablePromotion)"' \
            "experiments/policy-governed/results/scratch-soi-nix${{ matrix.nix }}.json"

      - name: §15 CACH1/CACH4 -- the same run again, warm
        # The SECOND run of the identical thing. Everything semantic must match
        # the first; only the clock may move. The staging store is shared with
        # the run above ON PURPOSE -- that IS the accelerator, and this is the
        # measurement of what it is allowed to change.
        run: |
          set -o pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          NSE_PG_STAGING="$RUNNER_TEMP/pg-shared-staging" ./bin/nse-pg scratch \
            --installable "path:$PWD/fixture#default" \
            --guarantee source-origin-independence \
            --scratch-dir "$RUNNER_TEMP/pg-scratch-warm" \
            --out "experiments/policy-governed/results/scratch-warm-nix${{ matrix.nix }}.json" \
            2>&1 | tail -20
          R=experiments/policy-governed/results
          ./bin/nse-pg digest --facts /dev/null >/dev/null 2>&1 || true
          # The comparison, through the function that defines what may differ.
          nix-shell -p jq --run true >/dev/null 2>&1 || true
          bash -c '
            . lib/common.sh; . lib/pg-common.sh; . lib/pg-cache.sh
            nse_pg_cache_compare "'"$R"'/scratch-soi-nix${{ matrix.nix }}.json" \
                                 "'"$R"'/scratch-warm-nix${{ matrix.nix }}.json"' \
            | tee "$R/cache-compare-nix${{ matrix.nix }}.json" | jq .
          # CACH1 and CACH4 are the assertion, not the narration.
          bash -c '
            . lib/common.sh; . lib/pg-common.sh; . lib/pg-cache.sh
            nse_pg_cache_compare "'"$R"'/scratch-soi-nix${{ matrix.nix }}.json" \
                                 "'"$R"'/scratch-warm-nix${{ matrix.nix }}.json"' \
            | jq -e '.CACH1_semanticsUnchanged and .CACH4_onlyCostMoved' >/dev/null \
            || { echo "CACH1/CACH4 VIOLATED: the cache changed something other than the clock" >&2; exit 1; }
          echo "CACH1=held CACH4=held"

      - name: §15 CACH2 -- a corrupted accelerator cannot become evidence
        # RUN 10 MEASURED THIS AND THE MEASUREMENT WAS NOT SOUND. Two defects,
        # both of the kind this repository has a protocol about:
        #
        #   1. It corrupted whatever directory `find` happened to return first
        #      -- a zlib build output. Under SOURCE_ORIGIN_INDEPENDENCE the
        #      escrow holds SOURCE material, so the corrupted object may not be
        #      in the set under test at all. A specimen outside the population
        #      is not a specimen.
        #
        #   2. It then read a PASS as CACH2 holding. A PASS cannot distinguish
        #      "Nix rejected the corrupted bytes and refetched" from "the
        #      corrupted bytes were copied into the escrow and the acceptance
        #      test happily replayed them" -- and the second is CACH2 VIOLATED.
        #      A check that cannot emit the failing state is not a check.
        #
        # Both are fixed here. The victim is a DISCOVERED SOURCE, taken from
        # the escrow's own discovery document, so it is certainly in the set.
        # And the verdict is decided by comparing bytes: the escrowed object is
        # copied back out into a fresh store and hashed. If it matches the
        # CORRUPTED hash, corrupted bytes became evidence.
        run: |
          set -o pipefail
          S="$RUNNER_TEMP/pg-shared-staging"
          DISC="$RUNNER_TEMP/pg-scratch-soi/discovery.json"
          if [ ! -f "$DISC" ]; then echo "no discovery document; CACH2 NOT MEASURED"; exit 0; fi
          # A source the escrow is FOR, that is present in the accelerator.
          victim=""
          while read -r p; do
            [ -n "$p" ] || continue
            if [ -d "$S$p" ] || [ -f "$S$p" ]; then victim=$p; break; fi
          done < <(jq -r '.sources[] | select(.storePath != null) | .storePath' "$DISC")
          if [ -z "$victim" ]; then
            echo "no DISCOVERED SOURCE is present in the accelerator; CACH2 NOT MEASURED"
            echo "(and NOT MEASURED is the honest answer -- corrupting something else"
            echo " would measure a population this guarantee does not cover)"
            exit 0
          fi
          echo "victim (a discovered source): $victim"
          target=$(find "$S$victim" -type f -print -quit 2>/dev/null || true)
          [ -n "$target" ] || target="$S$victim"
          chmod -R u+w "$S$victim" 2>/dev/null || true
          before=$(sha256sum "$target" | cut -d' ' -f1)
          printf 'CORRUPTED-BY-CACH2-CONTROL\n' >> "$target"
          after=$(sha256sum "$target" | cut -d' ' -f1)
          rel=${target#"$S$victim"}
          echo "corrupted file: $target"
          echo "  sha256 before: $before"
          echo "  sha256 after:  $after"
          [ "$before" != "$after" ] || { echo "the corruption did not change the file; NOT MEASURED"; exit 0; }

          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          rc=0
          NSE_PG_STAGING="$S" ./bin/nse-pg scratch \
            --installable "path:$PWD/fixture#default" \
            --guarantee source-origin-independence \
            --scratch-dir "$RUNNER_TEMP/pg-scratch-corrupt" \
            --out "experiments/policy-governed/results/scratch-corrupt-nix${{ matrix.nix }}.json" \
            > /tmp/corrupt.log 2>&1 || rc=$?
          echo "run exit=$rc"
          tail -20 /tmp/corrupt.log

          # THE DECISIVE OBSERVATION. Copy the object back OUT of the escrow
          # into a fresh store and hash the same file. This is the only reading
          # that can tell the two outcomes apart.
          verdict=NOT_MEASURED
          CACHE="$RUNNER_TEMP/pg-scratch-corrupt/cache"
          FRESH=$RUNNER_TEMP/cach2-fresh
          rm -rf "$FRESH"; mkdir -p "$FRESH"
          if [ -d "$CACHE" ] && nix copy --no-check-sigs \
                 --from "file://$CACHE" --to "$FRESH" "$victim" >/tmp/cach2-copy.log 2>&1; then
            got=$(sha256sum "$FRESH$victim$rel" 2>/dev/null | cut -d' ' -f1 || true)
            echo "  sha256 in the escrow: ${got:-<absent>}"
            if [ "$got" = "$after" ]; then
              verdict=VIOLATED
            elif [ "$got" = "$before" ]; then
              verdict=HELD_BYTES_ARE_ORIGINAL
            elif [ -z "$got" ]; then
              verdict=NOT_MEASURED_OBJECT_NOT_IN_ESCROW
            else
              verdict=HELD_BYTES_ARE_NEITHER
            fi
          elif [ "$rc" -ne 0 ]; then
            verdict=HELD_RUN_REFUSED
          else
            echo "could not read the object back out of the escrow:"; tail -5 /tmp/cach2-copy.log || true
            verdict=NOT_MEASURED_UNREADABLE
          fi
          echo "CACH2=$verdict"
          jq -n --arg v "$verdict" --arg victim "$victim" --arg before "$before" \
                --arg after "$after" --argjson rc "$rc" \
             '{control: "CACH2", verdict: $v, victim: $victim,
               sha256Original: $before, sha256Corrupted: $after, runExitCode: $rc,
               note: "VIOLATED means the corrupted bytes came back out of the escrow. Any HELD_* means they did not. NOT_MEASURED_* means this run could not tell, which is recorded rather than rounded to a pass."}' \
             > "experiments/policy-governed/results/cach2-nix${{ matrix.nix }}.json"
          case $verdict in
            VIOLATED) echo "CACH2 VIOLATED: corrupted accelerator bytes reached the escrow" >&2; exit 1 ;;
            *) : ;;
          esac

      - name: §16 control -- the STRONG path still works with the new machinery
        # At least one control must show ESCROW_REPLAY is still compatible with
        # the policy layer. A line that only ever exercises the cheap guarantee
        # has quietly changed what the project proves.
        run: |
          set -o pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          ./bin/nse-pg scratch \
            --installable "path:$PWD/fixture#default" \
            --guarantee escrow-replay \
            --scratch-dir "$RUNNER_TEMP/pg-scratch-replay" \
            --out "experiments/policy-governed/results/scratch-replay-nix${{ matrix.nix }}.json" \
            2>&1 | tail -40
          jq -r '"CHECK: \(.checkName)", "  exit=\(.exitCode) elapsed=\(.elapsedMilliseconds)ms"' \
            "experiments/policy-governed/results/scratch-replay-nix${{ matrix.nix }}.json"

      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-governed-qualification-nix${{ matrix.nix }}
          path: |
            experiments/policy-governed/results/
          if-no-files-found: warn
          retention-days: 14
